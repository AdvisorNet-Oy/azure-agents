name: Mandatum-viikkoraportti

on:
  schedule:
    # Tiistai klo 9.00 Suomen aikaa. GitHub ajaa cronin vain UTC:ssä, joten
    # kesäaika (UTC+3) ja talviaika (UTC+2) hoidetaan kahdella ajastuksella;
    # "Tarkista kellonaika" -vaihe päästää läpi vain sen, jossa Helsingissä on klo 9.
    - cron: "0 6 * * 2"
    - cron: "0 7 * * 2"
  workflow_dispatch: # manuaalinen ajo Actions-välilehdeltä

permissions:
  contents: read

jobs:
  raportti:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Tarkista kellonaika (Suomen aika)
        id: aika
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "aja=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Europe/Helsinki date +%H)" = "09" ]; then
            echo "aja=true" >> "$GITHUB_OUTPUT"
          else
            echo "aja=false" >> "$GITHUB_OUTPUT"
            echo "Helsingissä ei ole klo 9 – ohitetaan (toinen ajastus hoitaa)."
          fi

      - uses: actions/checkout@v4
        if: steps.aika.outputs.aja == 'true'

      - uses: actions/setup-python@v5
        if: steps.aika.outputs.aja == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mandatum-raportti/requirements.txt

      - name: Asenna riippuvuudet
        if: steps.aika.outputs.aja == 'true'
        run: pip install -r mandatum-raportti/requirements.txt

      - name: Luo raportti
        if: steps.aika.outputs.aja == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        working-directory: mandatum-raportti
        run: python raportti.py

      - name: Tallenna raportti
        if: steps.aika.outputs.aja == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rahastoraportti
          path: mandatum-raportti/raportit/
          retention-days: 90